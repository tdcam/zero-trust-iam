---
- name: Playbook to configure IPA server
  hosts: idm.aus.redhat.com
  become: true
  gather_facts: true

  vars:
    # Basic Setup
    ipaserver_domain: aus.redhat.com
    ipaserver_realm: AUS.REDHAT.COM
    ipaadmin_password: CHANGEME
    ipadm_password: CHANGEME
    ipaserver_hostname: idm.aus.redhat.com
    ipaserver_ip_addresses: ["172.31.100.37"]

    # DNS Configuration
    ipaserver_setup_dns: yes
    ipaserver_no_host_dns: yes
    ipaserver_auto_reverse: yes
    ipaserver_forwarders:
      - 8.8.8.8
      - 4.2.2.2

    # Other Options
    ipaclient_mkhomedir: yes

    # 1. Force the underlying ipaserver deployment logic to configure NTP natively
    ipaserver_install_ntp: yes
    ipaserver_ntp_pool: pool.ntp.org

    # 2. Drop the redundant client-level pool definition to prevent variable collision
    ipaclient_install_ntp: yes

  roles:
    - role: freeipa.ansible_freeipa.ipaserver

  tasks:
    # We simplify this by letting the module handle standard GSS-TSIG policies
    - name: Ensure Forward Zone has GSS-TSIG update policies
      freeipa.ansible_freeipa.ipadnszone:
        name: "{{ ipaserver_domain }}"
        dynamic_update: true
        ipaadmin_password: "{{ ipaadmin_password }}"
        ipaadmin_principal: admin

    # Target the existing zone by name with state 'enabled' to update its attributes
    - name: Ensure Reverse Zone has GSS-TSIG update policies
      freeipa.ansible_freeipa.ipadnszone:
        name: "100.31.172.in-addr.arpa."
        dynamic_update: true
        state: enabled
        ipaadmin_password: "{{ ipaadmin_password }}"
        ipaadmin_principal: admin

    - name: Allow PTR synchronization globally
      freeipa.ansible_freeipa.ipadnsconfig:
        allow_sync_ptr: true
        ipaadmin_password: "{{ ipaadmin_password }}"
        ipaadmin_principal: admin
